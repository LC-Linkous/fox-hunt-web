name: tests

# Three layers, no hardware:
#   node      the device layer and the pure logic against the simulated fox's byte stream
#   firmware  the real firmware/code.py running on simulated CircuitPython + a simulated SA868
#   page      the whole page in headless Chromium against the simulated fox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check every module
        run: for f in $(find js -name '*.js') sw.js; do node --check "$f"; done
      - name: Device-layer and logic tests
        run: node --test tests/*.test.mjs

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Firmware on simulated hardware
        run: cd tests/firmware && python -m unittest -v

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Page tests in headless Chromium
        run: REQUIRE_BROWSER=1 node --test tests/page/page.test.mjs
